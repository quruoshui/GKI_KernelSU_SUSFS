name: Android 12 5.10
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions

on:
  workflow_call:  # This allows this workflow to be called from another workflow
    inputs:
      make_release:
        required: true
        type: boolean
        default: true
      kernelsu_variant:
        required: true
        type: string
        default: Next
      kernelsu_branch:
        required: true
        type: string
        default: Stable
      # kernelsu_branch_other:
      #   required: false
      #   type: string
      #   default: ""
      version:
        required: false
        type: string
        default: ""
      use_zram:
        description: '是否开启增加更多ZRAM算法?'
        required: true
        type: boolean
        default: true
      use_kpm:
        description: '是否开启KPM功能?'
        required: true
        type: boolean
        default: true
      use_O2:
        description: '是否开启O2编译优化?'
        required: true
        type: boolean
        default: true
      BBG:
        description: "是否启用内核层面阻止对关键分区/设备节点的非法写入(LSM)？"
        required: true
        type: boolean
        default: true
jobs:
  build-kernel-a12-5-10-kernelsu-susfs:
    strategy:
      fail-fast: false
      matrix:
        include:
        - sub_level: "218"
          os_patch_level: "2024-08"
        - sub_level: "226"
          os_patch_level: "2024-11"
        - sub_level: "233"
          os_patch_level: "2025-02"
        - sub_level: "236"
          os_patch_level: "2025-05"
        - sub_level: "237"
          os_patch_level: "2025-6"
        - sub_level: "240"
          os_patch_level: "2025-09"
        - sub_level: "246"
          os_patch_level: "2025-12"
        - sub_level: "X"
          os_patch_level: "lts"
    uses: ./.github/workflows/gki-kernel.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release || false }}
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      # revision: ${{ matrix.revision }}
      kernelsu_variant: ${{ inputs.kernelsu_variant || 'Next' }}
      kernelsu_branch: ${{ inputs.kernelsu_branch || 'Dev' }}
      # kernelsu_branch_other: ${{ inputs.kernelsu_branch_other || '' }}
      version: ${{ inputs.version || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_kpm: ${{ inputs.use_kpm }}
      use_O2: ${{ inputs.use_O2 || false }}
      BBG: ${{ inputs.BBG || true }}